name: Publish

# Runs on every push to main. Publishing only happens when package.json carries a
# version that is not yet on the marketplace; otherwise --skip-duplicate makes the
# publish steps no-ops and the run just builds and type-checks.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # A red suite must not ship.
      - run: npm test

      # vscode:prepublish runs the production esbuild bundle.
      - name: Package
        run: npx --yes @vscode/vsce package -o extension.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: extension-vsix
          path: extension.vsix

      - name: Publish to Visual Studio Marketplace
        run: npx --yes @vscode/vsce publish --packagePath extension.vsix --skip-duplicate
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        run: npx --yes ovsx publish extension.vsix --skip-duplicate
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
